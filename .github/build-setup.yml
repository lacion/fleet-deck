# Extra build steps of the cargo-dist release jobs (dist-workspace.toml
# `github-build-setup`, DL-400). The deck embeds the built board, so web/dist
# must exist before `cargo build`. Versions as in .github/workflows/v2.yml.
- name: Set up bun
  uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
  with:
    bun-version: 1.4.2
- name: Build the board (web/dist)
  run: |
    bun install --cwd web --frozen-lockfile --ignore-scripts
    bun run --cwd web build
