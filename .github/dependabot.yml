version: 2
updates:
  # One small PR per dependency: the board toolchain and the Rust crates are
  # the artifact pipeline, so each bump is a security-sensitive change.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
