name: Bug report
description: Report something in Fleet Deck that is broken or behaving unexpectedly.
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Exact versions, the
        `fleetdeck doctor` output and a log excerpt help us reproduce it.

        Before you start: please search existing issues to avoid duplicates.
        Never report a vulnerability here: use the security policy.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug. What did you see?
      placeholder: The board showed the session as running after the agent stopped...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What did you think would happen instead?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make this happen ourselves? Numbered steps are ideal.
      placeholder: |
        1. Run `fleetdeck up`
        2. Start a Claude session in `~/projects/foo`
        3. Stop the station
        4. Look at the session card
    validations:
      required: false
  - type: input
    id: fleetdeck-version
    attributes:
      label: Fleet Deck version
      description: From `fleetdeck --version`.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      description: How does Fleet Deck run?
      options:
        - "fleetdeck up (deck and station on one machine)"
        - Deck and stations on different machines
        - As a service (fleetdeck service install)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      description: The operating system of the machine with the problem.
      options:
        - Linux
        - WSL2
        - macOS
    validations:
      required: true
  - type: input
    id: provider-versions
    attributes:
      label: Provider CLI versions
      description: From `claude --version` and `codex --version`.
      placeholder: Claude Code 2.1.300, codex-cli 0.162.1
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: fleetdeck doctor
      description: The output of `fleetdeck doctor`. It changes nothing.
      render: shell
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: >
        Service: `journalctl --user -u fleetdeck-up.service` (Linux, WSL) or
        `~/Library/Logs/fleetdeck/up.log` (macOS). Else the standard error of
        `fleetdeck up`. Secrets are never logged, but prompts, paths and session
        titles can be: redact anything sensitive before you paste.
      render: shell
    validations:
      required: false
