# Publish to npm on a version tag, via OIDC trusted publishing.
#
# There is no NPM_TOKEN. npm authenticates this workflow by its identity — repo +
# workflow filename, as configured under the package's Trusted Publisher settings
# on npmjs.com. Two consequences worth knowing before you edit this file:
#
#   - RENAMING THIS FILE BREAKS PUBLISHING. The trusted-publisher config names
#     `publish.yml` specifically. npm does not validate that config when you save
#     it, so a mismatch does not surface until a release fails with ENEEDAUTH.
#   - `id-token: write` is the whole mechanism. Without it there is no OIDC token
#     to exchange and npm falls back to looking for a credential that isn't there.
#
# Provenance attestation is generated automatically under trusted publishing —
# deliberately NO `--provenance` flag; passing it is not how you turn it on.
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # the trusted-publishing credential; nothing works without it

jobs:
  publish:
    # A human must approve before the OIDC credential mints. Without this, any
    # push of a v* tag by anyone with repo write publishes to npm unreviewed —
    # the drift gates below prove committed==rebuilt, never that the commit
    # itself was reviewed. The `release` environment (repo Settings →
    # Environments, required reviewers) is the checkpoint.
    environment: release
    # GitHub-hosted runner required — OIDC trusted publishing does not support
    # self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs Node >= 22.14. Publishing is also the one job
          # that must never reuse a warm cache: what we ship is decided entirely by
          # what is committed at this tag.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # bun is the package manager (install + bundle + board build + test run
      # below). The npm CLI is retained ONLY for `npm publish` — trusted
      # publishing is an npm/OIDC mechanism bun cannot perform. Pinned to the bun
      # the release was validated against, matching the SHA-pinning discipline.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Node 24 still ships an npm below the 11.5.1 floor that trusted publishing
      # requires. Without this the publish fails asking for a token.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # The tag is the release. If it disagrees with package.json, one of the two
      # is a lie — and a mislabelled version on npm cannot be taken back. (We have
      # already shipped one: npm 0.7.1 does not match git v0.7.1.)
      # The tag check alone is not enough: package.json can be bumped while the
      # plugin manifests and board/package.json stay behind (ci.yml's version job
      # never runs on tags, and bun.lock carries no root version to cross-check
      # against), and then npm, the marketplace cache, and board metadata all
      # disagree about what this release is. Verify the whole contract against
      # the tag before anything irreversible.
      - name: Fail if the tag and every version manifest disagree
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"

      # A tag can point at ANY commit — including one that never survived review
      # on main (a branch prepared weeks earlier carrying this version string).
      # Publish only what main actually contains.
      - name: Fail if the tagged commit is not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not an ancestor of origin/main — cut the tag from main"
            exit 1
          fi

      # No lifecycle scripts: esbuild ships its binary as an optional platform
      # dep (verified 0.16.0), so nothing the install runs may execute code.
      # --frozen-lockfile is bun's `npm ci` (fail on any lockfile drift).
      - run: bun install --frozen-lockfile --ignore-scripts

      # Release gate — the full suite under Bun (bun:sqlite, the exact runtime
      # that ships; `bun run test` execs `bun test`). node:sqlite is retired
      # under the single-runtime model, so the last gate before an irreversible
      # publish verifies the shipping channel. A standalone adapter-contract step
      # first proves the dual DB seam's driver in isolation (open/exec/prepare/
      # run/get/all + the missed-`.get()` -> undefined normalization), then the
      # whole suite runs. This is belt-and-suspenders with ci.yml — the tagged
      # commit is already an ancestor of main (gated above) — but this is the one
      # irreversible moment, so it re-proves the shipping runtime here too.
      - name: bun:sqlite adapter contract (the dual-seam gate)
        run: |
          bun -e '
            const { openDatabase } = await import("./scripts/fleetd/sqlite.ts");
            const db = openDatabase(":memory:");
            db.exec("CREATE TABLE t(id INTEGER PRIMARY KEY, name TEXT)");
            const r = db.prepare("INSERT INTO t(name) VALUES (?)").run("heron");
            const one = db.prepare("SELECT name FROM t WHERE id = ?").get(r.lastInsertRowid);
            const miss = db.prepare("SELECT name FROM t WHERE id = ?").get(999);
            const all = db.prepare("SELECT id, name FROM t").all();
            db.close();
            const ok = one.name === "heron" && miss === undefined
              && all.length === 1 && typeof r.lastInsertRowid === "number";
            console.log(JSON.stringify({ got: one.name, missIsUndefined: miss === undefined, rows: all.length }));
            if (!ok) { console.error("bun:sqlite adapter contract FAILED"); process.exit(1); }
            console.log("bun:sqlite channel OK");
          '
      - run: bun run test

      # The published tarball carries the COMMITTED bundle and board-dist, never a
      # fresh build. So prove here — at the only moment it is irreversible — that
      # what is committed is what the source actually produces. `main` gates this
      # on every push, but a tag can point at any commit, and a stale bundle on npm
      # is forever.
      - name: Fail if the committed artifacts are stale
        run: |
          bun run bundle
          git diff --exit-code scripts/fleetd/fleetd.bundle.mjs
          (cd board && bun install --frozen-lockfile --ignore-scripts && bun run build)
          git diff --exit-code scripts/fleetd/board-dist
          # git diff ignores UNTRACKED rebuild output (a fresh hashed chunk or
          # lazy stylesheet the tag forgot to stage) — gate on porcelain too.
          if [ -n "$(git status --porcelain --untracked-files=all -- scripts/fleetd/board-dist)" ]; then
            echo "::error::board build produced untracked files — stage the rebuilt board-dist"
            git status --porcelain --untracked-files=all -- scripts/fleetd/board-dist
            exit 1
          fi

      # No --provenance (automatic), no NODE_AUTH_TOKEN (OIDC).
      - run: npm publish --access public
