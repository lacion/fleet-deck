name: CI
on:
  push: {branches: [main]}
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

# Runtime model (see the plan's F2 pillar): the daemon runs on TWO runtimes and
# the SQLite driver differs by construction — the Claude Code plugin path forks
# the exact Node that Claude Code launched (node:sqlite), the standalone/dev path
# runs under bun (bun:sqlite). Both channels are gated here: the `test` matrix is
# the AUTHORITATIVE Node lane (node:sqlite — the plugin path that must never
# regress), and `bun-runtime` gates the bun:sqlite channel. bun is the package
# manager everywhere; the Node lanes install with bun but run the suite under
# Node (`bun run test:*` execs `node --test …`). setup-bun is pinned to the exact
# bun the migration was validated against, matching the SHA-pinning discipline of
# checkout/setup-node.

jobs:
  # Toolchain gate: strict TypeScript + ESLint. Fast, no daemon, no tmux — the
  # first signal a PR gets. Runtime-agnostic (tsc/eslint), so it runs under bun
  # alone. Both root and board deps are installed: `tsc -p board` and the
  # type-aware eslint over board/src both need board's types (@types/react …).
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: cd board && bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint

  # AUTHORITATIVE test lane: the node:sqlite channel. The plugin daemon always
  # forks the Node that Claude Code launched, so Node is the runtime that must
  # never regress. bun installs deps; the tests run under Node — `bun run test`
  # execs `node --test …`, and the filewise runner spawns `process.execPath`
  # (the matrix Node), so the matrix version is honoured end to end.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # '22.13.0' is pinned on purpose: it is the declared engine floor
        # (node:sqlite loads unflagged from 22.13.0), and the moving '22' alias
        # would silently stop exercising it as the 22 line advances.
        node-version: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      # Node 22's test runner corrupts its parent<->child IPC under CI load
      # ("Unable to deserialize cloned data" — nodejs/node#64061; fixed by
      # #64706, which current Node 24 ships but whose 22.x backport is
      # unreleased as of 2026-08). The filewise runner executes each test file
      # in-process (no runner IPC) with the same per-file process isolation.
      # REVERT to plain `bun run test` here when a 22.x release carries the fix.
      - if: matrix.node-version != '24'
        run: bun run test:filewise
        env:
          FLEETDECK_TEST_WAIT_SCALE: 3
      - if: matrix.node-version == '24'
        run: bun run test
        # Shared-runner lanes are slow and noisy in exactly the way the macOS
        # advisory lane is — every wait routes through the WAIT_SCALE knob
        # (tests/helpers/wait.mjs), so give the Linux lanes the same headroom
        # instead of tuning timeouts one flake at a time.
        env:
          FLEETDECK_TEST_WAIT_SCALE: 3

  # bun:sqlite channel gate. The dual DB seam (scripts/fleetd/sqlite.mjs) is the
  # whole reason the daemon can run on either runtime, so the bun driver's
  # contract is gated deterministically (open/exec/prepare/run/get/all + the
  # missed-.get() -> undefined normalization that keeps the two channels
  # byte-identical). A SECOND step runs the full node:test suite under `bun test`
  # ADVISORY (never gates a merge — the Node lane above is authoritative), so the
  # log records how much of the suite bun's node:test compat currently runs. Per
  # test-suite-is-trust nothing is skipped or curated to force a pass: it runs
  # EVERY file and reports the count honestly.
  bun-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: bun:sqlite adapter contract (blocking — the dual-seam gate)
        run: |
          bun -e '
            const { openDatabase } = await import("./scripts/fleetd/sqlite.mjs");
            const db = openDatabase(":memory:");
            db.exec("CREATE TABLE t(id INTEGER PRIMARY KEY, name TEXT)");
            const r = db.prepare("INSERT INTO t(name) VALUES (?)").run("heron");
            const one = db.prepare("SELECT name FROM t WHERE id = ?").get(r.lastInsertRowid);
            const miss = db.prepare("SELECT name FROM t WHERE id = ?").get(999);
            const all = db.prepare("SELECT id, name FROM t").all();
            db.close();
            const ok = one.name === "heron" && miss === undefined
              && all.length === 1 && typeof r.lastInsertRowid === "number";
            console.log(JSON.stringify({ got: one.name, missIsUndefined: miss === undefined, rows: all.length }));
            if (!ok) { console.error("bun:sqlite adapter contract FAILED"); process.exit(1); }
            console.log("bun:sqlite channel OK");
          '
      - name: bun test — full suite, per file (ADVISORY, never gates)
        continue-on-error: true
        run: |
          pass=0; fail=0; failed=""
          for f in $(find tests -name '*.test.mjs' | sort); do
            # Per-file so a batch cannot vacuously pass, and time-boxed so one
            # wedged file cannot consume the job budget. node:test-only surface
            # (nested t.test, --experimental-loader …) fails here by design; the
            # Node lane is the gate, this is a compat signal.
            if timeout 120 bun test "$f" >/dev/null 2>&1; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1)); failed="$failed $f"
            fi
          done
          echo "bun test (advisory): $pass/$((pass + fail)) files passed under bun's node:test compat"
          if [ -n "$failed" ]; then
            echo "::notice::files bun's node:test compat does not yet run (advisory — Node lane is authoritative):"
            for f in $failed; do echo "  $f"; done
          fi

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run bundle
      - name: Fail if committed bundle is stale
        run: git diff --exit-code scripts/fleetd/fleetd.bundle.mjs
      # filewise for the same reason as the Node 22 test lane above
      # (nodejs/node#64061) — the bundle suite runs under Node 22.
      - run: bun run test:bundle:filewise
        env:
          FLEETDECK_TEST_WAIT_SCALE: 3

  board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: cd board && bun install --frozen-lockfile --ignore-scripts
      - run: cd board && bun run build
      - name: Fail if committed board build is stale
        # git diff alone ignores UNTRACKED rebuild output (a fresh hashed chunk
        # or lazy stylesheet the commit forgot to stage), so gate on porcelain.
        run: |
          git diff --exit-code scripts/fleetd/board-dist
          if [ -n "$(git status --porcelain --untracked-files=all -- scripts/fleetd/board-dist)" ]; then
            echo "::error::board build produced untracked files — stage the rebuilt board-dist"
            git status --porcelain --untracked-files=all -- scripts/fleetd/board-dist
            exit 1
          fi

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install tmux
        run: brew install tmux
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      # filewise for the same reason as the Node 22 test lane above
      # (nodejs/node#64061) — this job runs on Node 22.
      - run: bun run test:filewise
        env:
          FLEETDECK_TEST_WAIT_SCALE: 3

  # Four manifests carry the same version string, and nothing used to enforce
  # that. Standalone makes the drift user-visible: the npm version and the plugin
  # version are compared at every SessionStart, and a mismatch there is reported
  # to the user as a "restart your service" warning — so a release that forgets
  # one manifest now produces a warning that is simply wrong. Script-only (node
  # -p over manifests), so it needs no install and runs on the runner's Node.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail if the four manifests disagree on the version
        run: |
          pkg=$(node -p "require('./package.json').version")
          plugin=$(node -p "require('./.claude-plugin/plugin.json').version")
          market=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          board=$(node -p "require('./board/package.json').version")
          echo "package.json                    $pkg"
          echo ".claude-plugin/plugin.json      $plugin"
          echo ".claude-plugin/marketplace.json $market"
          echo "board/package.json              $board"
          for v in "$plugin" "$market" "$board"; do
            if [ "$v" != "$pkg" ]; then
              echo "::error::version drift — package.json says $pkg but a sibling manifest says $v"
              exit 1
            fi
          done
          echo "✓ all four agree on $pkg"

  # 0.16.0 — the hook scripts run on every installed machine at every
  # SessionStart with the user's full environment, and marketplace installs
  # track git main UNGATED (no npm publish, no tag). The marketplace plugin
  # cache keys on the plugin.json version, so the watched closure is the
  # COMPLETE behavior-bearing payload — hooks, bin/, all of scripts/fleetd/
  # (sources, the bundle the SessionStart hook actually execs, and the
  # board-dist the daemon serves), board/ sources, and .claude-plugin/ — not
  # just the hook-side paths (BUG-001: a daemon or board change with a rebuilt
  # artifact used to pass every gate with the version untouched, leaving
  # existing installs on the old cached payload under the same version). Any
  # change to that closure must ride a release — signalled by a version bump
  # in the same diff — never slip in on an ordinary commit. The closure
  # definition lives in ONE checked-in verifier so CI and local runs agree.
  # Script-only (execFileSync git), so it needs no install and runs on the
  # runner's Node.
  hook-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fail if the plugin payload changed without a version bump
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Push to main with the same before/after (e.g. branch creation) — nothing to check.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base to compare — skipping"
            exit 0
          fi
          git fetch --no-tags origin "$BASE" || true
          # BUG-001: the watched closure must cover the COMPLETE behavior-bearing
          # payload (daemon sources + bundle, board-dist, ...) — one checked-in
          # verifier so CI and local runs agree.
          node scripts/check-plugin-payload.mjs "$BASE"
          # The old predicate inferred a bump from a changed manifest PATHNAME —
          # editing package.json's description at an unchanged version passed,
          # even though Claude Code's plugin cache key (the version value) never
          # moved. The checker resolves the plugin version at base and head and
          # requires a real semantic increase plus manifest agreement.
          node scripts/check-release-gate.mjs "$BASE" HEAD
