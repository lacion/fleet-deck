[package]
name = "fleetdeck-cli"
description = "Fleet Deck v2 command-line binary `fleetdeck` (PLAN §1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fleetdeck"
path = "src/main.rs"

[dependencies]
fleetdeck-proto = { path = "../fleetdeck-proto" }
fleetdeck-core = { path = "../fleetdeck-core" }
fleetdeck-station = { path = "../fleetdeck-station" }
fleetdeck-deck = { path = "../fleetdeck-deck" }
fleetdeck-link = { path = "../fleetdeck-link" }
anyhow.workspace = true
clap.workspace = true
# Non-echoing invitation prompt (G12).
rustix = { workspace = true, features = ["termios"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The crash tests run the `fleetdeck` binary with `FLEETDECK_FAULT` (M2 P2-8).
fleetdeck-station = { path = "../fleetdeck-station", features = ["fault-injection"] }
fleetdeck-testkit = { path = "../fleetdeck-testkit" }
fleetdeck-link = { path = "../fleetdeck-link" }
rustls.workspace = true
tempfile.workspace = true

[lints]
workspace = true
