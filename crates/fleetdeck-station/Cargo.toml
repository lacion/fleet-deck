[package]
name = "fleetdeck-station"
description = "Fleet Deck v2 station: session host, event log, receipts, effect worker, workspace, policy (PLAN §6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Crash injection for the fault tests (M2 P2-8); never in a release build.
fault-injection = []

[dependencies]
fleetdeck-proto = { path = "../fleetdeck-proto" }
fleetdeck-core = { path = "../fleetdeck-core" }
fleetdeck-link = { path = "../fleetdeck-link" }
fleetdeck-providers = { path = "../fleetdeck-providers" }
async-trait = { workspace = true }
ring = { workspace = true }
rusqlite = { workspace = true }
rustix = { workspace = true, features = ["process"] }
rusqlite_migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
fleetdeck-testkit = { path = "../fleetdeck-testkit" }
tempfile = { workspace = true }

[lints]
workspace = true
