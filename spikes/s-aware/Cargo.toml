[package]
name = "s-aware"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "aware-server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
