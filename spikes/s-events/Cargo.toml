[package]
name = "s-events"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "events-server"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server", "transport-io"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
