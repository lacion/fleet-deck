# Fleet Deck v2 Cargo workspace.
# M1 (PLAN Phase 0) holds only the spike crates under spikes/.
# Phase 1 adds the product crates under crates/.
[workspace]
resolver = "3"
members = [
    "spikes/spike-canon",
    "spikes/s1-claude",
    "spikes/s2-codex",
    "spikes/s4-link",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
insta = { version = "1", features = ["json"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
